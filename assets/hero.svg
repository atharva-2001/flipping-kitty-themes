<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#faf4ed"/>
      <stop offset="0.5" stop-color="#c6a0f6"/>
      <stop offset="1" stop-color="#181926"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="960" height="400" rx="20" fill="url(#sky)"/>
  <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff" stroke="#1e1e2e" stroke-width="4" paint-order="stroke">flipping-kitty-themes</text>

  <!-- light stack -->
  <g filter="url(#sh)">
    <rect x="40" y="90" width="300" height="80" rx="10" fill="#faf4ed"/>
    <rect x="70" y="180" width="300" height="80" rx="10" fill="#eff1f5"/>
    <rect x="40" y="270" width="300" height="80" rx="10" fill="#fdf6e3"/>
  </g>
  <g font-size="14">
    <text x="60" y="124" fill="#575279"><tspan fill="#d7827e">➜</tspan> rose-pine-dawn</text>
    <rect x="60" y="138" width="120" height="6" rx="3" fill="#907aa9"/>
    <text x="90" y="214" fill="#4c4f69"><tspan fill="#40a02b">➜</tspan> catppuccin-latte</text>
    <rect x="90" y="228" width="160" height="6" rx="3" fill="#1e66f5"/>
    <text x="60" y="304" fill="#586e75"><tspan fill="#859900">➜</tspan> solarized-light</text>
    <rect x="60" y="318" width="90" height="6" rx="3" fill="#cb4b16"/>
  </g>

  <!-- command pill -->
  <g filter="url(#sh)">
    <rect x="378" y="194" width="204" height="52" rx="26" fill="#1e1e2e"/>
  </g>
  <text x="480" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#f5bde6">flip.sh toggle</text>
  <path d="M400 176 Q480 136 560 176" fill="none" stroke="#1e1e2e" stroke-width="3" stroke-linecap="round"/>
  <path d="M552 166 l10 10 l-14 4" fill="none" stroke="#1e1e2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M560 264 Q480 304 400 264" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M408 274 l-10 -10 l14 -4" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- dark stack -->
  <g filter="url(#sh)">
    <rect x="620" y="90" width="300" height="80" rx="10" fill="#24273a"/>
    <rect x="590" y="180" width="300" height="80" rx="10" fill="#1f1f28"/>
    <rect x="620" y="270" width="300" height="80" rx="10" fill="#24283b"/>
  </g>
  <g font-size="14">
    <text x="640" y="124" fill="#cad3f5"><tspan fill="#a6da95">➜</tspan> catppuccin-macchiato</text>
    <rect x="640" y="138" width="140" height="6" rx="3" fill="#c6a0f6"/>
    <text x="610" y="214" fill="#dcd7ba"><tspan fill="#98bb6c">➜</tspan> kanagawa</text>
    <rect x="610" y="228" width="100" height="6" rx="3" fill="#7e9cd8"/>
    <text x="640" y="304" fill="#c0caf5"><tspan fill="#9ece6a">➜</tspan> tokyo-night-storm</text>
    <rect x="640" y="318" width="170" height="6" rx="3" fill="#bb9af7"/>
  </g>
  <text x="480" y="380" text-anchor="middle" font-size="13" fill="#ffffff" stroke="#1e1e2e" stroke-width="3" paint-order="stroke">every open window · its own theme · works without a tty</text>
</svg>
